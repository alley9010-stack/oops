<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI4NEXT</title></head><body style="margin:0;background:#05080b;color:#fff;font-family:Arial,sans-serif">
<div id="loading" style="min-height:100vh;display:grid;place-items:center">Loading AI4NEXT…</div>
<script>
(async()=>{
  const urls=["https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-00.txt","https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-01.txt","https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-02.txt","https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-03.txt","https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-04.txt","https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-05.txt","https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-06.txt","https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-07.txt","https://raw.githubusercontent.com/alley9010-stack/oops/main/ai4next-v40/part-08.txt"];
  const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})));
  document.open();document.write(parts.join(''));document.close();
})().catch(e=>{document.getElementById('loading').textContent='Unable to load AI4NEXT';console.error(e)});
</script></body></html>
